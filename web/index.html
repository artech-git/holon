<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>txp — Transactional Processes</title>
  <meta name="description" content="txp: all-or-nothing execution of filesystem changes and sandboxed OS processes, coordinated by a crash-safe presumed-abort two-phase commit daemon written in Rust." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- apply the saved theme before first paint to avoid a flash -->
  <script>
    try { var t = localStorage.getItem('txp-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
