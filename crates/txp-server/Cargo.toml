[package]
name = "txp-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "txpd: the transactional-process daemon (JSON over a Unix socket; gRPC is Phase 4)."

[[bin]]
name = "txpd"
path = "src/main.rs"

[dependencies]
txp-core = { workspace = true }
txp-engine = { workspace = true }
txp-wal = { workspace = true }
txp-proc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
nix = { workspace = true, features = ["user"] }

[lints]
workspace = true
