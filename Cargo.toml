[workspace]
resolver = "3"
members = [
    "crates/txp-core",
    "crates/txp-wal",
    "crates/txp-lock",
    "crates/txp-participant",
    "crates/txp-fs",
    "crates/txp-proc",
    "crates/txp-manifest",
    "crates/txp-engine",
    "crates/txp-server",
    "crates/txp-cli",
    "crates/txp-sim",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
txp-core = { path = "crates/txp-core" }
txp-wal = { path = "crates/txp-wal" }
txp-lock = { path = "crates/txp-lock" }
txp-participant = { path = "crates/txp-participant" }
txp-fs = { path = "crates/txp-fs" }
txp-proc = { path = "crates/txp-proc" }
txp-manifest = { path = "crates/txp-manifest" }
txp-engine = { path = "crates/txp-engine" }

tokio = { version = "1.47", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32c = "0.6"
libc = "0.2"
parking_lot = "0.12"
clap = { version = "4", features = ["derive", "env"] }
toml = "0.9"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
async-trait = "0.1"
sha2 = "0.10"
hex = "0.4"
proptest = "1"
tempfile = "3"

[profile.release]
debug = 1
